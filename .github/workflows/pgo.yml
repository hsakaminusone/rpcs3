name: Host PGO

# Manual only. A profile trained on one title must not become a default
# (§8.5.1), so this job never gates a PR: it builds the instrumented emulator,
# runs whatever corpus the runner has, merges the profiles and reports whether
# the second stage consumes them.
on:
  workflow_dispatch:
    inputs:
      corpus_runs:
        description: "How many times to run the unit tests while instrumented"
        required: false
        default: "1"

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /tmp/ccache_dir
  KK_CACHE_DIR: /tmp/rpcs3-kosmickrisp
  QT_VER: '6.12.0'
  QT_VER_MAIN: '6'
  LLVM_COMPILER_VER: '22'
  RUN_UNIT_TESTS: 'ON'
  PGO_DIR: ${{ github.workspace }}/pgo

jobs:
  pgo:
    name: Two-stage host PGO (macOS arm64)
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setup MacPorts
        uses: melusina-org/setup-macports@v1
        with:
          cache: 'disable'

      - name: Stage 1 — instrumented build
        env:
          USE_PGO: GENERATE
          PGO_PROFILE: ${{ env.PGO_DIR }}
        run: |
          mkdir -p "$PGO_DIR"
          .ci/build-mac.sh

      - name: Run the corpus
        run: |
          # The unit tests are the only corpus a CI runner has. A real tune needs
          # recorded titles; the report below says so instead of implying the
          # profile generalises.
          for i in $(seq 1 ${{ inputs.corpus_runs }}); do
            ./build/bin/rpcs3_test --gtest_filter='CpuNative*' || true
          done

      - name: Merge profiles
        run: |
          # The profiles were produced by the toolchain that ran the build, so they
          # are merged with it: Homebrew llvm-profdata rejects Apple clang profiles.
          xcrun llvm-profdata merge -output=/tmp/pgo.profdata "$PGO_DIR"

      - name: Stage 2 — profile-use build
        env:
          USE_PGO: USE
          PGO_PROFILE: /tmp/pgo.profdata
        run: |
          rm -rf build
          .ci/build-mac.sh

      - name: Upload the profile
        uses: actions/upload-artifact@main
        with:
          name: host-pgo-profile
          path: /tmp/pgo.profdata
